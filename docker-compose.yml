services:
  frontend:
    build: ./Frontend
    container_name: frontend
    restart: unless-stopped
    # # Development only; in production you should remove this and use a static build
    # volumes:
    #   - ./Frontend:/Frontend             # Mounts local code into the container
    #   - /Frontend/node_modules           # Prevents local node_modules from overwriting the container's
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`sokrates.traefik.me`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=4200"
    networks:
      - gateway
      - backend
      - frontend
  
  backend:
    build: ./Backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: Env/db.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`nest.sokrates.traefik.me`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
    networks:
      - gateway
      - backend

  database:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_user -d data_inventory"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks:
      - backend
    env_file: Env/db.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - gateway
    env_file: Env/pgadmin.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`database.sokrates.traefik.me`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  python_container:
    build: ./Scripts
    container_name: python_container
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import requests; exit(0 if requests.get('http://localhost:5001/health').status_code == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      ollama_pull:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - backend
      - api
    env_file: Env/api_keys.env

  ollama:
   image: ollama/ollama
   volumes:
     - ollama_data:/root/.ollama
   restart: unless-stopped
   networks:
     - backend
     - api
   healthcheck:
     test: ["CMD", "ollama", "list"]
     interval: 10s
     timeout: 5s
     retries: 5
     start_period: 10s

  ollama_pull:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:1.5b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    env_file: Env/api_keys.env
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend

  ai_model:
    build: ./Model
    container_name: ai_model
    depends_on:
      python_container:
        condition: service_started
    networks:
      - backend

networks:
  gateway:
    external: true
  backend:
    internal: true
  frontend:
  api:

volumes:
  db-data:
  pgadmin-data:
  ollama_data: