services:
  frontend:
    build: ./Frontend
    container_name: frontend
    restart: unless-stopped
    # Alleen voor development, in productie zou je dit moeten verwijderen en een statische build gebruiken
    volumes:
      - ./Frontend:/Frontend             # Koppelt lokale code aan de container
      - /Frontend/node_modules           # Zorgt dat de lokale node_modules de container niet overschrijven

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`sokrates.traefik.me`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=4200"
    networks:
      - gateway
      - backend
      - frontend
  
  backend:
    build: ./Backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: Env/db.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`nest.sokrates.traefik.me`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
    networks:
      - gateway
      - backend

  database:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_user -d data_inventory"]
      interval: 10s
      retries: 5
      start_period: 15s
    networks:
      - backend
    env_file: Env/db.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - gateway
    env_file: Env/pgadmin.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`database.sokrates.traefik.me`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

