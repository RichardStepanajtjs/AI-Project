<app-page-header title="Home Page"></app-page-header>
<app-page-header title="Admin Dashboard"></app-page-header>

<main>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Totaal gebruikers</div>
      <div class="stat-value">{{amount_prospectlists}}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Actieve gebruikers</div>
      <div class="stat-value">{{amount_productsForms}}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Aantal Admins</div>
      <div class="stat-value">{{amount_jobForms}}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Aanvragen deze week</div>
      <div class="stat-value">404</div>
    </div>
  </div>
