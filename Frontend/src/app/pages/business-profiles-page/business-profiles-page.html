<app-page-header title="Business Profiles Overview"></app-page-header>
<app-filter-header [filters]="sectorFilters" activeFilter="geselecteerdeSector"></app-filter-header>
<main>
  @for (profile of businessProfiles; track $index) {
    <app-business-profile
        [companyName]="profile.naam"
        [province]="profile.gemeente"
        [countryCode]="profile.landcode"
        [jobDomain]="profile.jobdomein">
    </app-business-profile>}
</main>
