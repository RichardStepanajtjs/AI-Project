<div class="filters">

<!-- Dropdown menu -->
  @if (filters.length) {
    <div class="dropdown" [class.open]="dropdownOpen">
      <button class="dropdown-trigger" (click)="dropdownOpen = !dropdownOpen">
        {{ activeFilter || 'Filter' }}
        <span class="icon">▾</span>
      </button>
      <div class="dropdown-menu">
        @for (filter of filters; track filter) {
          <button
            class="dropdown-item"
            [class.active]="activeFilter === filter"
            (click)="activeFilterChange.emit(filter); dropdownOpen = false">
            {{ filter }}
          </button>
        }
      </div>
    </div>
  }

<!-- searchbar -->
  @if (showSearch) {
    <div class="search-wrapper">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input
        type="text"
        class="search-input"
        [placeholder]="searchPlaceholder"
        [value]="searchTerm"
        (input)="searchTermChange.emit($any($event.target).value)"/>
      @if (searchTerm) {
        <button class="clear-btn" (click)="searchTermChange.emit('')">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      }
    </div>
  }

  <!-- tag -->
  @if (showAddTag) {
    <input type="text" placeholder="tag" class="tag-input" [(ngModel)]="tagValue" (keydown.enter)="onAddTag()" />
    <button class="add-button" (click)="onAddTag()">{{ addLabel }}</button>
  }

</div>
